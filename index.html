/* ================= HERO ================= */

    bottom:0;
    left:0;

.unit-top{

    height:15px;

.unit-body{

}

    right:9px;
    top:10px;

}

.fan{

    height:105px;

    background:radial-gradient(circle,#263c48 0 8%,#172832 9% 100%);
    border:7px solid #cbd7dc;
    box-shadow:inset 0 0 15px #07131b;
}

.fan-blade{
    position:absolute;
    left:45px;
    top:8px;
    width:15px;
    height:42px;
    border-radius:12px;
    background:#7c929e;
    transform-origin:50% 47px;
}

.b1{transform:rotate(0deg);}
.b2{transform:rotate(120deg);}
.b3{transform:rotate(240deg);}

.fan-center{
    position:absolute;
    left:38px;
    top:38px;

}

.unit-brand{

    right:37px;

}

.unit-lines{
    position:absolute;
    bottom:12px;
    left:10px;
    width:185px;
    height:7px;

        #63747d 0 3px,
        transparent 3px 8px

}

.unit-feet{
    position:absolute;
    bottom:-8px;
    left:18px;
    width:170px;
    height:12px;
    border-radius:5px;
    background:#263b47;
}

/* CYLINDER */

.gas-cylinder{
    position:absolute;
    right:92px;
    bottom:55px;
    width:78px;
    height:170px;

}

.cylinder-label small{

.cylinder-valve{

    height:23px;

}

.valve-top{
    position:absolute;
    top:0;
    left:2px;
    width:24px;
    height:10px;
    border-radius:4px;
    background:#d4dfe2;
}

/* MANIFOLD */

.manifold{
    position:absolute;
    left:265px;
    bottom:35px;
    width:190px;
    height:230px;
    transform:rotate(-7deg);
}

.gauge{
    position:absolute;
    width:82px;
    height:82px;
    border-radius:50%;
    background:#dce5e8;
    border:7px solid #364952;
    box-shadow:0 7px 15px rgba(0,0,0,.4);
}

.red-gauge{
    right:0;
    top:0;
    border-color:#b72c35;
}

.blue-gauge{
    left:0;
    top:0;
    border-color:#2463a0;
}

.gauge-face{
    position:absolute;
    inset:7px;
    border-radius:50%;
    background:#f8faf9;
    color:#27343a;
    text-align:center;
    padding-top:20px;
    font-size:9px;
}

.gauge-face span{
    display:block;
    font-size:7px;
    font-weight:800;
}

.gauge-face b{
    font-size:13px;
}

.needle{
    position:absolute;
    left:38px;
    top:17px;
    width:2px;
    height:30px;
    background:#111;
    transform:rotate(35deg);
    transform-origin:bottom;
}

.manifold-body{
    position:absolute;
    top:83px;
    left:63px;
    width:64px;
    height:75px;
    border-radius:8px;
    background:linear-gradient(90deg,#aab7bb,#e0e7e8,#89989d);
    border:2px solid #63757b;
}

.knob{
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    top:20px;
    border:4px solid #26373e;
}

.red-knob{
    right:-20px;
    background:#d92832;
}

.blue-knob{
    left:-20px;
    background:#2372c2;
}

.hose{
    position:absolute;
    width:5px;
    height:80px;
    border-radius:5px;
    top:145px;
    transform-origin:top;
}

.red-hose{
    right:38px;
    background:#e8323a;
    transform:rotate(18deg);
}

.blue-hose{
    left:38px;
    background:#2980d9;
    transform:rotate(-18deg);
}

/* COOLING EFFECT */

.cooling-effect{
    position:absolute;
    left:85px;
    top:42px;
    color:#7cf4ff;
    font-size:25px;
    letter-spacing:8px;
    opacity:.75;
    text-shadow:0 0 15px #00eaff;
    animation:floatCooling 3s ease-in-out infinite;
}

@keyframes floatCooling{
    0%,100%{transform:translateY(0);opacity:.55;}
    50%{transform:translateY(-10px);opacity:1;}
}

.hvac-label{
    position:absolute;
    right:20px;
    top:20px;
    font-family:"Orbitron",sans-serif;
    color:#6beeff;
    font-size:15px;
    line-height:1.35;
    text-align:center;
    text-shadow:0 0 15px #00dfff;
}

.hvac-label span{
    color:white;
}

/* ================= TOOLS ================= */

.tools-section{
    max-width:1250px;
    margin:auto;
    padding:65px 5%;
}

.section-heading{
    text-align:center;
    margin-bottom:35px;
}

.section-heading h2{
    font-family:"Orbitron",sans-serif;
    font-size:34px;
}

.section-heading h2 span{
    background:linear-gradient(90deg,#00eaff,#7867ff,#db55df);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.section-heading p{
    color:#a5bfd3;
    margin-top:10px;
    font-size:14px;
}

.tools-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.tool-card{
    min-height:255px;
    padding:25px;
    border-radius:17px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(17,58,100,.72),rgba(4,23,45,.88));
    border:1px solid rgba(0,200,255,.4);
    transition:.35s;
}

.tool-card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 40px rgba(0,180,255,.18);
}

.tool-card:nth-child(2){border-color:#7659ff;}
.tool-card:nth-child(3){border-color:#00e5c5;}
.tool-card:nth-child(4){border-color:#ffae00;}
.tool-card:nth-child(5){border-color:#008cff;}
.tool-card:nth-child(6){border-color:#bf39ff;}

.tool-icon{
    width:58px;
    height:58px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    background:linear-gradient(135deg,#00bfff,#4565ff);
    margin-bottom:18px;
    box-shadow:0 8px 20px rgba(0,180,255,.22);
}

.tool-card:nth-child(2) .tool-icon{
    background:linear-gradient(135deg,#8354ff,#be45e9);
}

.tool-card:nth-child(3) .tool-icon{
    background:linear-gradient(135deg,#00d5aa,#00a7c7);
}

.tool-card:nth-child(4) .tool-icon{
    background:linear-gradient(135deg,#ffb300,#ff6900);
}

.tool-card:nth-child(5) .tool-icon{
    background:linear-gradient(135deg,#00bfff,#316eff);
}

.tool-card:nth-child(6) .tool-icon{
    background:linear-gradient(135deg,#9c3cff,#dd42e9);
}

.tool-card h3{
    font-family:"Orbitron",sans-serif;
    font-size:17px;
    margin-bottom:11px;
}

.tool-card p{
    color:#aec8db;
    line-height:1.55;
    font-size:13px;
    min-height:42px;
}

.card-button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:18px;
    padding:10px 17px;
    border-radius:22px;
    color:white;
    background:linear-gradient(90deg,#00bfff,#4774ff);
    text-decoration:none;
    font-size:12px;
    font-weight:800;
}

.coming{
    color:#c7b8ff;
    background:rgba(91,66,160,.38);

/* ================= FEATURE ================= */

.feature-box{
    max-width:1250px;
    margin:0 auto 55px;
    padding:27px 35px;
    border:1px solid #00dbc8;
    border-radius:17px;
    background:linear-gradient(90deg,rgba(0,164,175,.25),rgba(0,70,80,.35));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.feature-main{
    display:flex;
    align-items:center;

}

.feature-icon{

}

.feature-main h2{
    font-family:"Orbitron",sans-serif;

}

.feature-main p{
    color:#afd0d8;

}

.feature-points{
    display:flex;

.feature-point{

/* ================= FOOTER ================= */

footer{
    border-top:1px solid rgba(0,200,255,.35);
    background:#021121;
    padding:35px 5% 20px;
}

.footer-container{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr;

}

.footer-logo{
    font-family:"Orbitron",sans-serif;

}

.footer-logo span{
    color:#00dfff;
}

.footer p{
    color:#829eb4;

}

.footer-title{
    color:white;

.footer a{
    display:block;

.footer a:hover{

.email{

}

.copyright{
    max-width:1250px;

    padding-top:18px;

/* ================= MOBILE ================= */

@media(max-width:900px){

    .nav-links{
        gap:14px;
    }

    .search{
        display:none;
    }

    .hero-content{
        flex-direction:column;
        text-align:center;
    }

    .hero-left{
        width:100%;
    }

    .hero-features{
        justify-content:center;
    }

    .hero-image{
        width:100%;
        margin-top:35px;
    }

    .tools-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .feature-box{
        flex-direction:column;

    }

@media(max-width:600px){

    .navbar{
        height:auto;
        padding:13px 15px;
        flex-direction:column;
        gap:12px;
    }

    .logo{
        font-size:20px;
    }

    .logo-icon{
        font-size:28px;
    }

    .nav-links{
        gap:13px;
    }

    .nav-links a{
        font-size:12px;
    }

    .hero{
        min-height:auto;
    }

    .hero-content{
        padding:50px 20px;
        min-height:auto;
    }

    .hero h1{
        font-size:34px;
    }

    .hero-text{
        font-size:14px;
    }

    .hero-image{
        margin-top:35px;
    }

    .hvac-scene{
        height:310px;
        transform:scale(.9);
        transform-origin:center;
    }

    .outdoor-unit{
        left:12px;
        transform:scale(.78);
        transform-origin:bottom left;
    }

    .gas-cylinder{
        right:28px;
        transform:scale(.75);
        transform-origin:bottom right;
    }

    .manifold{
        left:150px;

    }

    }

    .feature-points{
        flex-wrap:wrap;
        justify-content:center;
    }

    .footer-container{
        grid-template-columns:1fr;
        text-align:center;
    }
}
